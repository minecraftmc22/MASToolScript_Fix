name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller MasInstaller.spec --noconfirm --clean

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = 'dist/MasInstaller.exe'
          if (-not (Test-Path $exe)) {
            Write-Host '::error::打包没有产出 dist/MasInstaller.exe'
            exit 1
          }
          Write-Host ("size = {0:N0} bytes" -f (Get-Item $exe).Length)
          # runner 是英文系统，强制 UTF-8，避免中文提示在管道里编码失败
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          $output = & $exe --help 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit code = $code"
          Write-Host '---------- output ----------'
          Write-Host $output
          if ($code -ne 0) {
            $brief = (($output -split "`n" | Where-Object { $_.Trim() }) | Select-Object -First 12) -join ' | '
            Write-Host "::error::MasInstaller.exe --help 退出码 $code，输出：$brief"
            exit 1
          }

      - name: Check tag matches VER
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          tag = os.environ['GITHUB_REF_NAME'].lstrip('vV')
          src = open('Tools/TLogo.py', encoding='utf-8').read()
          match = re.search(r'^VER\s*=\s*"([^"]+)"', src, re.M)
          if not match:
              sys.exit('没有在 Tools/TLogo.py 里找到 VER')
          ver = match.group(1)
          print('tag = {}, VER = {}'.format(tag, ver))
          if tag != ver:
              sys.exit('标签 {} 与 Tools/TLogo.py 里的 VER {} 不一致，请先改版本号'.format(tag, ver))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasInstaller-${{ github.ref_name }}
          path: dist/MasInstaller.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MasInstaller.exe
          name: MASToolKit ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
