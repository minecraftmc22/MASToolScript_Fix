name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller MasInstaller.spec --noconfirm --clean

      - name: Verify executable
        run: |
          if (!(Test-Path dist/MasInstaller.exe)) { throw "dist/MasInstaller.exe 未生成" }
          Get-Item dist/MasInstaller.exe | Select-Object Name, Length
          .\dist\MasInstaller.exe --help

      - name: Check tag matches VER
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          tag = os.environ['GITHUB_REF_NAME'].lstrip('vV')
          src = open('Tools/TLogo.py', encoding='utf-8').read()
          match = re.search(r'^VER\s*=\s*"([^"]+)"', src, re.M)
          if not match:
              sys.exit('没有在 Tools/TLogo.py 里找到 VER')
          ver = match.group(1)
          print('tag = {}, VER = {}'.format(tag, ver))
          if tag != ver:
              sys.exit('标签 {} 与 Tools/TLogo.py 里的 VER {} 不一致，请先改版本号'.format(tag, ver))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasInstaller-${{ github.ref_name }}
          path: dist/MasInstaller.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MasInstaller.exe
          name: MASToolKit ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
